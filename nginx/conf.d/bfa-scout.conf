# BFA-Scout origin reverse proxy (Phase 8 / 8.1).
#
# Cloudflare runs Full (strict): it terminates the public cert and
# re-encrypts to this origin, which presents a self-signed cert
# (generated on the droplet — see DEPLOY.md). server_name is `_`
# (catch-all) because Cloudflare sets the Host header and the droplet
# only ever serves this one app.

# ── Rate limiting (Phase 8.1) ─────────────────────────────────────────────────
# 10 requests/minute per IP on the login endpoint. Burst of 5 queued with no
# added delay; requests beyond burst+rate receive 429 immediately.
# Zone size 10MB ≈ 160 000 unique IPs — plenty for BFA scale.
# If legitimate users see 429, increase `rate` or `burst` in this zone.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# Plain HTTP → permanent HTTPS redirect. Cloudflare also does this at
# the edge ("Always Use HTTPS"); this covers direct-to-origin hits.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Bulk import (.xlsx/.csv up to 500 rows) + photo uploads.
    client_max_body_size 50M;

    # PDF generation (WeasyPrint) can take a few seconds; keep the
    # upstream timeout aligned with gunicorn's 120s ceiling so a slow
    # passport doesn't 504 at the proxy before the worker finishes.
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # ── Login rate limit (Phase 8.1) ────────────────────────────────────────────
    # Applies only to POST /auth/login. GET (render form) is not rate-limited so
    # the page still loads for users who hit 429 on their POST.
    location = /auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:5000/auth/login;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static assets served by Flask (placeholder.svg, css, js). Photos
    # in production come from the Spaces CDN, NOT this path, so this is
    # low-traffic; a short cache is plenty.
    location /static {
        proxy_pass http://app:5000/static;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Healthcheck — Cloudflare + uptime probes. No access-log noise.
    location = /healthz {
        proxy_pass http://app:5000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}
