{% extends 'base.html' %}
{% block title %}Sign In — BFA Scout{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">

    <!-- BFA crest placeholder + title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4"
           style="background:var(--brand);">
        <span class="text-white font-bold text-2xl">&#9651;</span>
      </div>
      <h1 class="text-2xl font-bold" style="color:var(--text);">BFA Scout</h1>
      <p class="text-sm mt-1" style="color:var(--text-muted);">National Team Committee Platform</p>
    </div>

    <!-- Login card -->
    <div class="rounded-lg p-6" style="background:var(--surface);border:1px solid var(--border);">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-4">
          <label for="email" class="block text-sm font-medium mb-1"
                 style="color:var(--text);">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 class="w-full rounded px-3 py-2 text-sm outline-none focus:ring-2"
                 style="background:var(--bg);border:1px solid var(--border);
                        color:var(--text);ring-color:var(--brand);">
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-medium mb-1"
                 style="color:var(--text);">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 class="w-full rounded px-3 py-2 text-sm outline-none focus:ring-2"
                 style="background:var(--bg);border:1px solid var(--border);
                        color:var(--text);ring-color:var(--brand);">
        </div>

        <button type="submit"
                class="w-full py-2 rounded font-semibold text-sm text-white transition-opacity hover:opacity-90"
                style="background:var(--brand);">
          Sign in
        </button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
