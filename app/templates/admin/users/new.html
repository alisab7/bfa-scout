{% extends 'base.html' %}
{% block title %}New User — BFA Scout{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-10">

  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('admin.users_list') }}"
       class="text-sm" style="color:var(--text-muted);">&larr; Users</a>
    <h1 class="text-xl font-bold" style="color:var(--text);">New User</h1>
  </div>

  <div class="rounded-lg p-6" style="background:var(--surface);border:1px solid var(--border);">
    <form method="POST" action="{{ url_for('admin.users_new') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-4">
        <label for="email" class="block text-sm font-medium mb-1" style="color:var(--text);">
          Email <span style="color:var(--brand);">*</span>
        </label>
        <input id="email" name="email" type="email" required autocomplete="off"
               value="{{ form.get('email', '') }}"
               class="w-full rounded px-3 py-2 text-sm"
               style="background:var(--bg);border:1px solid var(--border);color:var(--text);">
      </div>

      <div class="mb-4">
        <label for="full_name" class="block text-sm font-medium mb-1" style="color:var(--text);">
          Full Name <span style="color:var(--brand);">*</span>
        </label>
        <input id="full_name" name="full_name" type="text" required
               value="{{ form.get('full_name', '') }}"
               class="w-full rounded px-3 py-2 text-sm"
               style="background:var(--bg);border:1px solid var(--border);color:var(--text);">
      </div>

      <div class="mb-4">
        <label for="full_name_ar" class="block text-sm font-medium mb-1" style="color:var(--text);">
          Full Name (Arabic)
        </label>
        <input id="full_name_ar" name="full_name_ar" type="text" dir="rtl"
               value="{{ form.get('full_name_ar', '') }}"
               class="w-full rounded px-3 py-2 text-sm"
               style="background:var(--bg);border:1px solid var(--border);color:var(--text);">
      </div>

      <div class="mb-4">
        <label for="role" class="block text-sm font-medium mb-1" style="color:var(--text);">
          Role <span style="color:var(--brand);">*</span>
        </label>
        <select id="role" name="role"
                class="w-full rounded px-3 py-2 text-sm"
                style="background:var(--bg);border:1px solid var(--border);color:var(--text);">
          {% for r in roles %}
            <option value="{{ r }}"
                    {% if form.get('role', 'viewer') == r %}selected{% endif %}>
              {{ r | replace('_', ' ') | title }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-4">
        <label for="password" class="block text-sm font-medium mb-1" style="color:var(--text);">
          Password <span style="color:var(--brand);">*</span>
        </label>
        <input id="password" name="password" type="password" required minlength="12" maxlength="128"
               autocomplete="new-password"
               class="w-full rounded px-3 py-2 text-sm"
               style="background:var(--bg);border:1px solid var(--border);color:var(--text);">
        <p class="text-xs mt-1" style="color:var(--text-muted);">
          Minimum 12 characters. Must include uppercase, lowercase, and a digit.
        </p>
      </div>

      <div class="mb-6">
        <label for="confirm_password" class="block text-sm font-medium mb-1" style="color:var(--text);">
          Confirm Password <span style="color:var(--brand);">*</span>
        </label>
        <input id="confirm_password" name="confirm_password" type="password" required minlength="12" maxlength="128"
               autocomplete="new-password"
               class="w-full rounded px-3 py-2 text-sm"
               style="background:var(--bg);border:1px solid var(--border);color:var(--text);">
      </div>

      <div class="flex gap-3">
        <button type="submit"
                class="px-4 py-2 rounded font-semibold text-sm text-white"
                style="background:var(--brand);">Create user</button>
        <a href="{{ url_for('admin.users_list') }}"
           class="px-4 py-2 rounded font-semibold text-sm"
           style="background:var(--bg);color:var(--text-muted);border:1px solid var(--border);">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
